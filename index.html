<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048 — 3D</title>

  <link href="style/main.css" rel="stylesheet" type="text/css">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
</head>
<body>
  <div class="hud">
    <div class="heading">
      <h1 class="title">2048<span>3D</span></h1>
      <div class="scores-container">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-container">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Best</div>
          <div class="best-container">0</div>
        </div>
      </div>
    </div>

    <div class="above-game">
      <p class="game-intro">Arrow keys move tiles. Drag to orbit. Scroll to zoom.</p>
      <div class="actions">
        <a class="background-button">Swap Background</a>
        <a class="recenter-button">Recenter</a>
        <a class="restart-button">New Game</a>
      </div>
    </div>
  </div>

  <div class="game-container" id="scene">
    <div class="game-message">
      <p></p>
      <div class="lower">
        <a class="keep-playing-button">Keep going</a>
        <a class="retry-button">Try again</a>
      </div>
    </div>
  </div>

  <p class="hint">Same 2048 rules — just in a 3D scene you can orbit like Blender.</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
